apiVersion: syncit/v1
kind: Bundle
metadata:
  name: docker
  version: latest
spec:
  targets:
    distro: ubuntu
    codename: noble
    arch: amd64
  tasks:
    - name: Install Docker CE
      plugin: apt
      base_installroot: /tmp/debootstrap-root
      repos:
        - name: docker
          url: deb https://download.docker.com/linux/ubuntu noble stable
          gpg_key: https://download.docker.com/linux/ubuntu/gpg
      packages:
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin
