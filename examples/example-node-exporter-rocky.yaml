apiVersion: syncit/v1
kind: Bundle
metadata:
  name: node-exporter
  version: latest
spec:
  targets:
    distro: rocky
    codename: "9"
    arch: amd64
  tasks:
    - name: Install Node Exporter
      plugin: dnf
      releasever: "9"
      base_installroot: /tmp/rocky-root
      repos:
        - name: epel
          baseurl: https://dl.fedoraproject.org/pub/epel/9/Everything/x86_64/
          gpgkey: https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-9
          gpgcheck: "1"
      packages:
        - node-exporter
