apiVersion: syncit/v1
kind: Bundle
metadata:
  name: terraform
  version: latest
spec:
  targets:
    distro: ubuntu
    codename: noble
    arch: amd64
  tasks:
    - name: Install Terraform
      plugin: apt
      base_installroot: /tmp/debootstrap-root
      repos:
        - name: hashicorp
          url: deb https://apt.releases.hashicorp.com noble main
          gpg_key: https://apt.releases.hashicorp.com/gpg
      packages:
        - terraform
