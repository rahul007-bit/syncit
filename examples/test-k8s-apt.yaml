apiVersion: syncit/v1
kind: Bundle
metadata:
  name: k8s-offline-apt
  version: "1.35.5"
  description: "Kubernetes v1.35.5 + CRI-O + Flannel + PostgreSQL 14 + Podman bundle (Ubuntu 24.04 / Noble)"

spec:
  targets:
    distro: ubuntu
    codename: noble
    arch: amd64

  tasks:
    # ─── 1. Kubernetes packages (kubeadm / kubelet / kubectl) ───────────────────
    #
    # base_installroot: path to a minimal Ubuntu 24.04 root on the BUILD HOST.
    # This tells APT to resolve deps as if installing into a freshly-installed
    # Ubuntu node (skipping libc6, systemd, etc. which are always present).
    #
    # Create it once on your build host:
    #   sudo mkdir -p /opt/syncit-roots/ubuntu2404-minimal
    #   sudo debootstrap noble /opt/syncit-roots/ubuntu2404-minimal
    #
    # If you omit base_installroot, APT falls back to the build host's installed
    # state — which may over- or under-bundle depending on how closely it
    # matches the target. A warning will be printed during pack.
    - name: Install Kubernetes packages
      plugin: apt
      # base_installroot: /opt/syncit-roots/ubuntu2404-minimal
      repos:
        - name: kubernetes
          url: "deb [signed-by=/etc/apt/keyrings/kubernetes.gpg] https://pkgs.k8s.io/core:/stable:/v1.35/deb/ /"
          gpg_key: "https://pkgs.k8s.io/core:/stable:/v1.35/deb/Release.key"
      packages:
        - kubeadm=1.35.5-1.1
        - kubelet=1.35.5-1.1
        - kubectl=1.35.5-1.1

    # ─── 2. CRI-O container runtime ─────────────────────────────────────────────
    - name: Install CRI-O
      plugin: apt
      # base_installroot: /opt/syncit-roots/ubuntu2404-minimal
      repos:
        - name: crio
          url: "deb [signed-by=/etc/apt/keyrings/crio.gpg] https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v1.35/deb/ /"
          gpg_key: "https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v1.35/deb/Release.key"
      packages:
        - cri-o

    # ─── 3. Podman (from Ubuntu universe — no extra repo needed) ────────────────
    - name: Install Podman
      plugin: apt
      # base_installroot: /opt/syncit-roots/ubuntu2404-minimal
      packages:
        - podman

    # ─── 4. PostgreSQL 14 ────────────────────────────────────────────────────────
    - name: Install PostgreSQL 14
      plugin: apt
      # base_installroot: /opt/syncit-roots/ubuntu2404-minimal
      repos:
        - name: pgdg
          url: "deb [signed-by=/etc/apt/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt noble-pgdg main"
          gpg_key: "https://www.postgresql.org/media/keys/ACCC4CF8.asc"
      packages:
        - postgresql-14
        - postgresql-client-14

    # ─── 5. Container images: Kubernetes control plane ──────────────────────────
    - name: Pull Kubernetes control-plane images
      plugin: oci_image
      images:
        - source: registry.k8s.io/kube-apiserver:v1.35.5
        - source: registry.k8s.io/kube-controller-manager:v1.35.5
        - source: registry.k8s.io/kube-scheduler:v1.35.5
        - source: registry.k8s.io/kube-proxy:v1.35.5
        - source: registry.k8s.io/etcd:3.6.6-0
        - source: registry.k8s.io/coredns/coredns:v1.13.1
        - source: registry.k8s.io/pause:3.10.1

    # ─── 6. Container images: Flannel CNI ───────────────────────────────────────
    - name: Pull Flannel CNI images
      plugin: oci_image
      images:
        - source: ghcr.io/flannel-io/flannel:v0.28.3
        - source: ghcr.io/flannel-io/flannel-cni-plugin:v1.9.1-flannel1