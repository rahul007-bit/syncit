apiVersion: syncit/v1
kind: Bundle
metadata:
  name: k8s-offline-dnf
  version: "1.35.5"
  description: "Kubernetes v1.35.5 + CRI-O bundle via dnf (for RHEL/Rocky 9 targets)"

spec:
  targets:
    distro: rocky
    codename: "9"
    arch: amd64

  tasks:
    # ─── 1. Kubernetes packages (kubeadm / kubelet / kubectl) ────────────────────
    #
    # base_installroot: path to a minimal Rocky 9 root on the BUILD HOST.
    # This tells DNF to resolve deps as if installing into a freshly-installed
    # Rocky 9 node (skipping glibc, systemd, etc. which are always present).
    #
    # Create it once on your build host:
    #   sudo dnf install -y --installroot /opt/syncit-roots/rocky9-minimal \
    #     --releasever 9 @core --setopt=install_weak_deps=False
    #
    # If you omit base_installroot, DNF falls back to the build host's installed
    # state — which may over- or under-bundle depending on how closely it
    # matches the target. A warning will be printed during pack.
    - name: Install Kubernetes packages
      plugin: dnf
      base_installroot: /opt/syncit-roots/rocky9-minimal  # see comment above
      releasever: "9"
      repos:
        - name: kubernetes
          baseurl: https://pkgs.k8s.io/core:/stable:/v1.35/rpm/
          gpgcheck: "1"
          gpgkey: https://pkgs.k8s.io/core:/stable:/v1.35/rpm/repodata/repomd.xml.key
      packages:
        - kubeadm
        - kubelet
        - kubectl

    # ─── 2. CRI-O container runtime ─────────────────────────────────────────────
    - name: Install CRI-O
      plugin: dnf
      base_installroot: /opt/syncit-roots/rocky9-minimal
      releasever: "9"
      repos:
        - name: crio
          baseurl: https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v1.35/rpm/
          gpgcheck: "0"
      packages:
        - cri-o