[project]
name = "offlinectl"
version = "0.1.0"
description = "Air-gap bundle orchestrator for Linux environments"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "structlog>=24.0",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-subprocess>=1.5",
  "ruff>=0.4",
  "mypy>=1.10",
]

[project.scripts]
offlinectl = "offlinectl.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "mypy>=1.20.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.9",
    "types-pyyaml>=6.0.12.20250915",
]
