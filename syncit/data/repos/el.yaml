# Curated upstream repositories for RHEL-family targets (rhel, rocky, almalinux, centos).
#
# Schema per entry:
#   id              short key used as the repo name in the manifest
#   label           display label in the wizard checkbox
#   description     one-line description shown in the picker
#   distros         distro ids this entry supports
#   repo            dnf repo config: baseurl (+ optional gpgkey, gpgcheck)
#   repo_overrides  optional per-distro overrides of the repo config
#   vars            optional {name: {prompt, default}} placeholders rendered as {name}
#
# `$releasever`/`$basearch` are substituted by the wizard from the bundle target
# spec, so the generated manifest is independent of the build host's distro.
- id: epel
  label: EPEL
  description: Extra Packages for Enterprise Linux — huge community repo maintained by the Fedora project
  distros: [rhel, rocky, almalinux, centos]
  repo:
    baseurl: https://dl.fedoraproject.org/pub/epel/$releasever/Everything/$basearch/
    gpgkey: https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-$releasever
    gpgcheck: true

- id: docker-ce
  label: Docker CE
  description: Official Docker Engine, CLI, containerd and Buildx from download.docker.com
  distros: [rhel, rocky, almalinux, centos]
  repo:
    baseurl: https://download.docker.com/linux/centos/$releasever/$basearch/stable
    gpgkey: https://download.docker.com/linux/centos/gpg
    gpgcheck: true

- id: kubernetes
  label: Kubernetes (pkgs.k8s.io)
  description: Official kubeadm/kubelet/kubectl packages via pkgs.k8s.io
  distros: [rhel, rocky, almalinux, centos, fedora]
  vars:
    k8s_series:
      prompt: Kubernetes series (e.g. v1.34)
      default: v1.34
  repo:
    baseurl: https://pkgs.k8s.io/core:/stable:/{k8s_series}/rpm/
    gpgkey: https://pkgs.k8s.io/core:/stable:/{k8s_series}/rpm/repodata/repomd.xml.key
    gpgcheck: true

- id: cri-o
  label: CRI-O (isv:cri-o)
  description: CRI-O container runtime — stable series v1.34-v1.37 (project moved off pkgs.k8s.io, which froze at v1.32)
  distros: [rhel, rocky, almalinux, centos]
  vars:
    crio_series:
      prompt: CRI-O series (v1.34 - v1.37)
      default: v1.34
  repo:
    baseurl: https://download.opensuse.org/repositories/isv:/cri-o:/stable:/{crio_series}/rpm/
    gpgkey: https://download.opensuse.org/repositories/isv:/cri-o:/stable:/{crio_series}/rpm/repodata/repomd.xml.key
    gpgcheck: true

- id: cri-o-legacy
  label: CRI-O legacy (pkgs.k8s.io)
  description: Old pkgs.k8s.io channel — stable series stopped at v1.32 (use isv:cri-o for newer)
  distros: [rhel, rocky, almalinux, centos]
  vars:
    crio_series:
      prompt: CRI-O series (e.g. v1.32)
      default: v1.32
  repo:
    baseurl: https://pkgs.k8s.io/addons:/cri-o:/stable:/{crio_series}/rpm/
    gpgkey: https://pkgs.k8s.io/addons:/cri-o:/stable:/{crio_series}/rpm/repodata/repomd.xml.key
    gpgcheck: true

- id: pgdg
  label: PostgreSQL PGDG
  description: Official PostgreSQL RPMs — adds the common repo plus the versioned server repo
  distros: [rhel, rocky, almalinux, centos]
  vars:
    pgdg_ver:
      prompt: PostgreSQL major version (14-18)
      default: "17"
    pgdg_minor:
      prompt: RHEL minor release used by PGDG mirrors (e.g. 9.6)
      default: "9.6"
  repos:
    - name: pgdg-common
      baseurl: https://download.postgresql.org/pub/repos/yum/common/redhat/rhel-{pgdg_minor}-$basearch
      gpgkey: https://download.postgresql.org/pub/repos/yum/keys/PGDG-RPM-GPG-KEY-RHEL
      gpgcheck: true
    - name: pgdg{pgdg_ver}
      baseurl: https://download.postgresql.org/pub/repos/yum/{pgdg_ver}/redhat/rhel-{pgdg_minor}-$basearch
      gpgkey: https://download.postgresql.org/pub/repos/yum/keys/PGDG-RPM-GPG-KEY-RHEL
      gpgcheck: true

- id: grafana
  label: Grafana
  description: Grafana OSS + Grafana Agent from rpm.grafana.com
  distros: [rhel, rocky, almalinux, centos, fedora]
  repo:
    baseurl: https://rpm.grafana.com
    gpgkey: https://rpm.grafana.com/gpg.key
    gpgcheck: true

- id: hashicorp
  label: HashiCorp
  description: Vault, Terraform, Consul, Nomad official RPMs
  distros: [rhel, rocky, almalinux, centos]
  repo:
    baseurl: https://rpm.releases.hashicorp.com/RHEL/$releasever/$basearch/stable
    gpgkey: https://rpm.releases.hashicorp.com/gpg
    gpgcheck: true

- id: mongodb-org
  label: MongoDB (official)
  description: MongoDB server 8.0 from repo.mongodb.org
  distros: [rhel, rocky, almalinux, centos]
  repo:
    baseurl: https://repo.mongodb.org/yum/redhat/$releasever/mongodb-org/8.0/$basearch/
    gpgkey: https://www.mongodb.org/static/pgp/server-8.0.asc
    gpgcheck: true

- id: influxdata
  label: InfluxData
  description: InfluxDB, Telegraf, Chronograf from repos.influxdata.com
  distros: [rhel, rocky, almalinux, centos]
  repo:
    baseurl: https://repos.influxdata.com/rhel/$releasever/$basearch/stable
    gpgkey: https://repos.influxdata.com/influxdata-archive_compat.key
    gpgcheck: true

- id: zabbix
  label: Zabbix
  description: Zabbix monitoring server/agent from repo.zabbix.com
  distros: [rhel, rocky, almalinux, centos]
  vars:
    zabbix_ver:
      prompt: Zabbix major version (e.g. 7.0)
      default: "7.0"
  repo:
    baseurl: https://repo.zabbix.com/zabbix/{zabbix_ver}/rhel/$releasever/$basearch/
    gpgkey: https://repo.zabbix.com/RPM-GPG-KEY-ZABBIX
    gpgcheck: true

- id: nginx
  label: nginx (official)
  description: nginx stable packages from nginx.org
  distros: [rhel, rocky, almalinux, centos]
  repo:
    baseurl: https://nginx.org/packages/rhel/$releasever/$basearch/
    gpgkey: https://nginx.org/keys/nginx_signing.key
    gpgcheck: true

- id: redis
  label: Redis (official)
  description: Redis server/stack from packages.redis.io
  distros: [rhel, rocky, almalinux, centos]
  repo:
    baseurl: https://packages.redis.io/rpm/rhel9/$basearch
    gpgkey: https://packages.redis.io/gpg
    gpgcheck: true

- id: rabbitmq
  label: RabbitMQ Server
  description: RabbitMQ messaging server from the official packagecloud repo
  distros: [rhel, rocky, almalinux, centos]
  repo:
    baseurl: https://packagecloud.io/rabbitmq/rabbitmq-server/el/9/$basearch
    gpgkey: https://packagecloud.io/rabbitmq/rabbitmq-server/gpgkey
    gpgcheck: true

- id: rabbitmq-erlang
  label: Erlang (for RabbitMQ)
  description: Modern Erlang runtime required by RabbitMQ
  distros: [rhel, rocky, almalinux, centos]
  repo:
    baseurl: https://packagecloud.io/rabbitmq/erlang/el/9/$basearch
    gpgkey: https://packagecloud.io/rabbitmq/erlang/gpgkey
    gpgcheck: true

- id: mysql-community
  label: MySQL Community
  description: MySQL server 8.x from repo.mysql.com (prompts for 8.0/8.4)
  distros: [rhel, rocky, almalinux, centos]
  vars:
    mysql_ver:
      prompt: MySQL series (e.g. 8.4-community, 8.0-community)
      default: "8.4-community"
  repo:
    baseurl: https://repo.mysql.com/yum/{mysql_ver}/el/9/$basearch/
    gpgkey: https://repo.mysql.com/RPM-GPG-KEY-mysql-2023
    gpgcheck: true

- id: mariadb
  label: MariaDB (official)
  description: MariaDB server from yum.mariadb.org (11.8/11.4/10.11 available; amd64 naming per MariaDB convention)
  distros: [rhel, rocky, almalinux, centos]
  vars:
    mariadb_ver:
      prompt: MariaDB series (e.g. 11.4, 11.8)
      default: "11.4"
  repo:
    baseurl: https://yum.mariadb.org/{mariadb_ver}/rhel9-amd64/
    gpgkey: https://yum.mariadb.org/RPM-GPG-KEY-MariaDB
    gpgcheck: true

- id: clickhouse
  label: ClickHouse
  description: ClickHouse OLAP database from packages.clickhouse.com (stable)
  distros: [rhel, rocky, almalinux, centos]
  repo:
    baseurl: https://packages.clickhouse.com/rpm/stable/
    gpgkey: https://packages.clickhouse.com/rpm/stable/repodata/repomd.xml.key
    gpgcheck: true

- id: elasticsearch
  label: Elastic Stack
  description: Elasticsearch, Logstash, Kibana from artifacts.elastic.co (prompts 9.x/8.x)
  distros: [rhel, rocky, almalinux, centos]
  vars:
    elastic_ver:
      prompt: Elastic major (e.g. 9.x, 8.x)
      default: 9.x
  repo:
    baseurl: https://artifacts.elastic.co/packages/{elastic_ver}/yum
    gpgkey: https://artifacts.elastic.co/GPG-KEY-elasticsearch
    gpgcheck: true

- id: jenkins
  label: Jenkins
  description: Jenkins CI controller from pkg.jenkins.io (redhat-stable)
  distros: [rhel, rocky, almalinux, centos]
  repo:
    baseurl: https://pkg.jenkins.io/redhat-stable/
    gpgkey: https://pkg.jenkins.io/redhat-stable/jenkins.io-2023.key
    gpgcheck: true

- id: hadoop-bigtop
  label: Apache Hadoop (Bigtop)
  description: Full Hadoop ecosystem (Hadoop, HBase, Hive, Spark...) via Apache Bigtop
  distros: [rhel, rocky, almalinux, centos]
  vars:
    bigtop_ver:
      prompt: Bigtop release (e.g. 3.6.0)
      default: "3.6.0"
  repo:
    baseurl: http://repos.bigtop.apache.org/releases/{bigtop_ver}/rockylinux/9/$basearch
    gpgkey: https://dist.apache.org/repos/dist/release/bigtop/KEYS
    gpgcheck: true

- id: rpmfusion-free
  label: RPM Fusion (Free)
  description: Community add-ons Fedora/EL won't ship (multimedia, drivers)
  distros: [rhel, rocky, almalinux, centos]
  repo:
    baseurl: http://download1.rpmfusion.org/free/el/updates/$releasever/$basearch/
    gpgcheck: false

- id: rpmfusion-nonfree
  label: RPM Fusion (Non-Free)
  description: Nonfree RPM Fusion (NVIDIA drivers, firmware, codecs)
  distros: [rhel, rocky, almalinux, centos]
  repo:
    baseurl: http://download1.rpmfusion.org/nonfree/el/updates/$releasever/$basearch/
    gpgcheck: false
